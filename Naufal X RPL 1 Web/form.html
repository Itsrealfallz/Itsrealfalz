<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir</title>
</head>
<body>
    <form>
        <label>Nama :</label>
        <input type="text"> <br>
                                                                                                                                               
        <label>Email :</label>
        <input type="email"> <br>

        <label>Password :</label>
        <input type="password"> <br>

        <input type="radio" name="jenis-kelamin" id="Laki-Laki"> Laki-Laki 
        <input type="radio" name="jenis-kelamin" id="Perempuan"> Perempuan <br>

        <label>Alamat :</label>
        <textarea name="Alasan masuk RPL" id="Alasan" cols="15" rows="3"></textarea> <br>

        <label>No. HP :</label>
        <input type="number"> <br>

        <label>Tanggal Lahir :</label>
        <input type="date" name="tanggal-lahir" id="tanggal-lahir"> <br>

        <input type="datetime-local"> <br>

        <input type="time"> <br>

        <label>Mapel yang Disukai :</label> <br>
        <input type="checkbox" name="mapel" value="Matematika"> Matematika <br>
        <input type="checkbox" name="mapel" value="IPAS"> IPAS <br>
        <input type="checkbox" name="mapel" value="Bahasa Inggris"> Bahasa Inggris <br>

        <select name="Agama" id="Agama">
            <option value="Islam">Islam</option>
            <option value="Kristen">Kristen</option>
            <option value="Khatolik">Khatolik</option>
            <option value="Hindu">Hindu</option>
            <option value="Buddha">Buddha</option>
            <option value="Khonghucu">Khonghucu</option>
        </select> <br>

        <input type="button" value="Submit">
        <input type="reset" value="Clear">
    </form>
</body>
</html>
