<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>
<body>
    <table border="1" align="center" cellspacing="0" cellpadding="10" bgcolor="lightblue">
        <caption align="top"><h1>Daftar Harga</h1></caption>
        <thead>
            <tr>
                <th>Nama Barang</th>
                <th>Kategori</th>
                <th>Harga Satuan</th>
                <th>Jumlah Barang</th>
                <th>Total</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Keyboard</td>
                <td rowspan="2">Tools</td>
                <td>Rp.90.000</td>
                <td>4</td>
                <td>Rp.360.000</td>
            </tr>
            <tr>
                <td>Mouse</td>
                <td>Rp.50.000</td>
                <td>5</td>
                <td>Rp.250.000</td>
            </tr>
            <tr>
                <td>USB 8 GB</td>
                <td rowspan="2">Utility</td>
                <td>Rp.60.000</td>
                <td>2</td>
                <td>Rp.120.000</td>
            </tr>
            <tr>
                <td>CD Blank</td>
                <td>Rp.5.000</td>
                <td>10</td>
                <td>Rp.50.000</td>
            </tr>
            <tr>
                <td colspan="4">Total</td>
                <td>Rp.780.000</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
