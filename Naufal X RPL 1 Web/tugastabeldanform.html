<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form and Table</title>
</head>
<body>
    <p>
        <b>Nama : Naufal Dzaky Alvaro</b>
    </p>
    <p>
        <b>Absen : 25</b>
    </p>
    <p>
        <b>Kelas : X RPL 1</b>
    </p>
    <table border="2" bordercolor="#d98b98" align="center" cellpadding="10">
        <tr>
            <th colspan="3" align="center">
                <h1>Form Input Biodata</h1>
            </th>
        </tr>

        <tr>
            <td>
                <form>
                    <table border="0" cellpadding="10" cellspacing="0">
                        <tr>
                            <td width="320"><b>Nama Lengkap</b></td>
                            <td>:</td>
                            <td><input type="text" name="nama" size="46"></td>
                        </tr>

                        <tr>
                            <td><b>Tempat, Tanggal Lahir</b></td>
                            <td>:</td>
                            <td>
                                <input type="text" name="tempat" size="20"> ,
                                <input type="text" name="tanggal" size="2"> /
                                <input type="text" name="bulan" size="2"> /
                                <input type="text" name="tahun" size="10">
                            </td>
                        </tr>

                        <tr>
                            <td><b>Alamat</b></td>
                            <td>:</td>
                            <td><textarea name="alamat" cols="60" rows="5"></textarea></td>
                        </tr>

                        <tr>
                            <td><b>No. Telp/HP</b></td>
                            <td>:</td>
                            <td><input type="tel" name="telepon" size="30"></td>
                        </tr>

                        <tr>
                            <td><b>Jenis Kelamin</b></td>
                            <td>:</td>
                            <td>    
                                <input type="radio" name="kelamin" value="Laki-Laki"> Laki-Laki
                                <input type="radio" name="kelamin" value="Perempuan"> Perempuan
                            </td>
                        </tr>

                        <tr>
                            <td><b>Agama</b></td>
                            <td>:</td>
                            <td>
                                <select name="agama">
                                    <option value="Islam">Islam</option>
                                    <option value="Kristen">Kristen</option>
                                    <option value="Katolik">Katolik</option>
                                    <option value="Hindu">Hindu</option>
                                    <option value="Buddha">Buddha</option>
                                    <option value="Khonghucu">Khonghucu</option>
                                </select>
                            </td>
                        </tr>

                        <tr>
                            <td><b>Hobby</b></td>
                            <td>:</td>
                            <td>
                                <input type="checkbox" name="hobby" value="Baca Buku"> Baca Buku
                                <input type="checkbox" name="hobby" value="Olah Raga"> Olah Raga
                                <input type="checkbox" name="hobby" value="Main Game"> Main Game
                                <input type="checkbox" name="hobby" value="Hiking"> Hiking
                            </td>
                        </tr>

                        <tr>
                            <td colspan="3" align="center">
                                <input type="submit" value="Submit">
                                <input type="reset" value="Clear">
                            </td>
                        </tr>
                    </table>
                </form>
            </td>
        </tr>
    </table>
</body>
</html>
